<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KEYFRAME 어휘">
<meta name="theme-color" content="#7A5B3F">
<title>KEYFRAME 어휘 암기</title>
<style>
:root{
  --spot:#7A5B3F; --spot-2:#A07E5E; --spot-bg:#F3ECE4; --spot-ink:#fff;
  --bg:#FAF8F5; --card:#FFFFFF; --ink:#1F1A16; --ink-2:#5E554D; --ink-3:#958B81;
  --line:#E7E0D8; --no:#C2543F; --no-bg:#FBEAE6; --mid:#C68A1E; --mid-bg:#FBF2DF; --ok:#3F7A5B; --ok-bg:#E5F1EA;
  --shadow:0 1px 2px rgba(40,25,10,.06),0 6px 20px rgba(40,25,10,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --spot:#C9A27E; --spot-2:#A8845F; --spot-bg:#2E261F; --spot-ink:#1A1410;
  --bg:#151210; --card:#1F1B17; --ink:#F1EBE4; --ink-2:#BDB2A6; --ink-3:#857A6F;
  --line:#332C25; --no:#E5826C; --no-bg:#3A221C; --mid:#E3B04F; --mid-bg:#3A2E17; --ok:#7CC39B; --ok-bg:#1C3226;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --spot:#C9A27E; --spot-2:#A8845F; --spot-bg:#2E261F; --spot-ink:#1A1410;
  --bg:#151210; --card:#1F1B17; --ink:#F1EBE4; --ink-2:#BDB2A6; --ink-3:#857A6F;
  --line:#332C25; --no:#E5826C; --no-bg:#3A221C; --mid:#E3B04F; --mid-bg:#3A2E17; --ok:#7CC39B; --ok-bg:#1C3226;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body{min-height:100dvh;overscroll-behavior-y:none;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 16px)}
.top{display:flex;align-items:center;gap:8px;min-height:48px;margin-bottom:8px}
.top h1{font-size:17px;font-weight:700;margin:0;flex:1;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:active{background:var(--line)}
.icon-btn svg{width:22px;height:22px}
.hd{gap:12px}
.hd .brand{flex:1;font-size:15px;font-weight:800;letter-spacing:.16em;color:var(--spot);line-height:1}
.hd .brand-oj{font-size:16px;font-weight:800;letter-spacing:-.01em;color:var(--ink);line-height:1;text-align:right}
.hero{background:var(--spot);color:var(--spot-ink);border-radius:20px;padding:18px 18px 16px;box-shadow:var(--shadow)}
.hero .k{font-size:13px;opacity:.85}
.hero .big{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:4px 0 2px}
.hero .big small{font-size:15px;font-weight:600;opacity:.85;margin-left:4px}
.hero .row{display:flex;gap:8px;margin-top:14px}
.hero .row button{flex:1;background:rgba(255,255,255,.18);border-radius:12px;padding:11px 0;font-weight:700;font-size:15px}
:root[data-theme="dark"] .hero .row button{background:rgba(0,0,0,.15)}
.hero .row button.solid{background:var(--spot-ink);color:var(--spot)}
.hero .row button:disabled{opacity:.45}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-3)}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;margin:16px 0 10px}
.seg button{flex:1;padding:8px 0;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.list{display:flex;flex-direction:column;gap:8px}
.set{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;text-align:left;width:100%}
.set:active{transform:scale(.99)}
.set .no{width:42px;height:42px;border-radius:12px;background:var(--spot-bg);color:var(--spot);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.set .no.lbl{width:58px;font-size:14px;letter-spacing:-.01em}
.set .mid{flex:1;min-width:0}
.set .t{font-weight:700;font-size:15px}
.set .s{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 키프레임 막대: 가는 트랙 + 굵은 진행선 + 끝에 ◆ (선은 ◆에서 끊음) */
.kbar{position:relative;height:12px;margin-top:6px;display:flex;align-items:center}
.kbar::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.kbar i{position:relative;display:block;height:3px}
.kbar .b1{background:var(--spot)}.kbar .b2{background:var(--spot-2);opacity:.5}
.kh{position:absolute;top:50%;width:9px;height:9px;background:var(--spot);transform:translate(-50%,-50%) rotate(45deg)}
.kh.zero{background:var(--card);border:1.5px solid var(--ink-3);left:4px!important}
.kfd{display:inline-block;width:10px;height:10px;background:var(--spot);transform:rotate(45deg);flex:none}
/* 키프레임 타임라인: ◆ 개수 = 횟수, 채운 ◆까지 선을 굵게 */
.kft{display:flex;align-items:center;flex:1;min-width:0}
.kft .d{width:11px;height:11px;transform:rotate(45deg);border:1.5px solid var(--ink-3);background:var(--card);flex:none}
.kft .d.on{background:var(--spot);border-color:var(--spot)}
.kft .l{flex:1;height:1px;background:var(--line);margin:0 4px}
.kft .l.on{height:3px;background:var(--spot)}
.set .pct small{font-weight:600;color:var(--ink-3);font-size:11.5px}
.set .pct{font-size:13px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums;flex:none}
.due-dot{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:var(--no);background:var(--no-bg);border-radius:6px;padding:1px 6px;vertical-align:1px}
.section-h{font-size:13px;font-weight:700;color:var(--ink-3);margin:18px 2px 8px;letter-spacing:.02em}
.modes{display:grid;gap:8px}
.mode{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;text-align:left}
.mode:active{transform:scale(.99)}
.mode .mi{width:40px;height:40px;border-radius:12px;background:var(--spot-bg);color:var(--spot);display:grid;place-items:center;flex:none}
.mode .mi svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mode .mtxt{font-size:13px;font-weight:800;letter-spacing:-.02em}.mode .mtxt i{font-style:normal;opacity:.55;margin:0 1px}
.mode .mtx{flex:1;min-width:0;display:grid}
.mode .mtx b{font-size:15.5px;font-weight:700}
.mode .mtx small{font-size:12.5px;color:var(--ink-3)}
.mode .chev{color:var(--ink-3);font-size:20px;line-height:1}
.mode.pri{background:var(--spot);border-color:transparent;color:var(--spot-ink)}
.mode.pri .mi{background:rgba(255,255,255,.16);color:var(--spot-ink)}
.mode.pri .mtx small,.mode.pri .chev{color:inherit;opacity:.8}
.mode-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode-pair .chev{display:none}
.mode-pair .mode{gap:10px;padding:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink-2)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* study */
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;flex:1}
.prog i{display:block;height:100%;background:var(--spot);transition:width .25s}
.cnt{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.stage{flex:1;display:flex;flex-direction:column;min-height:0}
.flash{flex:1;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;position:relative;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;min-height:340px}
.flash .face{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px;text-align:center}
.flash .word{font-size:clamp(30px,10vw,42px);font-weight:800;letter-spacing:-.02em;line-height:1.15;word-break:break-word}
.flash .ipa{color:var(--ink-3);font-size:16px;margin-top:6px;font-family:"Lucida Grande","Arial Unicode MS",system-ui,sans-serif}
.flash .hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:12.5px;color:var(--ink-3)}
.flash .kmean{font-size:clamp(20px,6vw,26px);font-weight:700;line-height:1.4}
.flash .back{flex:1;overflow:auto;padding:20px 18px 18px;-webkit-overflow-scrolling:touch}
.back .hw{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:12px}
.back .hw b{font-size:24px;font-weight:800;letter-spacing:-.01em}
.back .hw span{color:var(--ink-3);font-size:14px}
.sense{margin-bottom:16px}
.sense .m{font-size:17px;font-weight:700;line-height:1.45}
.pos{font-style:italic;font-weight:600;font-size:.8em;color:var(--spot);margin-right:6px;white-space:nowrap}
.mlist{display:grid;gap:8px;text-align:left}
.ml{display:flex;align-items:baseline;gap:7px;font-weight:700;line-height:1.45}
.ml .pos{margin:0;flex:none}
.ml .mt{flex:1;min-width:0}
.mn{flex:none;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--spot);color:var(--spot-ink);font-size:11px;font-weight:800;font-style:normal;transform:translateY(-1px)}
.mlist.lg .ml{font-size:19px}.mlist.md .ml{font-size:17px}
.mlist.sm{gap:3px}.mlist.sm .ml{font-size:14px;font-weight:600;gap:5px}.mlist.sm .mn{width:15px;height:15px;font-size:9.5px}
.face .mlist{display:inline-grid;max-width:100%}
.sense .d{font-size:13.5px;color:var(--ink-2);margin-top:4px;font-style:italic}
.sense .e{font-size:14.5px;margin-top:8px;padding-left:10px;border-left:3px solid var(--spot-bg)}
.sense .e .ko{display:block;color:var(--ink-3);font-size:13px;margin-top:2px}
.sense .meta{font-size:13px;color:var(--ink-2);margin-top:8px;display:grid;gap:3px}
.sense .meta em{font-style:normal;font-weight:700;color:var(--ink-3);margin-right:6px;font-size:12px}
mark{background:none;color:var(--spot);font-weight:700}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.judge button{border-radius:18px;padding:17px 0;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px}
.judge .ic{font-size:20px;line-height:1}
.j-no{background:var(--no-bg);color:var(--no)}.j-ok{background:var(--ok-bg);color:var(--ok)}
.j-next{background:var(--ink);color:var(--bg)}.j-next.ok{background:var(--ok);color:#fff}
.j-oops{background:var(--card);border:1.5px solid var(--line)!important;color:var(--ink-2);font-size:15px!important;font-weight:700!important}
.flash.is-ok{border-color:var(--ok)}.flash.is-no{border-color:var(--no)}
.lv-tag{font-size:12px;color:var(--ink-3);margin-bottom:10px}
.means{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.means li{font-size:19px;font-weight:700;line-height:1.45}
.means.multi{counter-reset:m}
.means.multi li{padding-left:22px;position:relative}
.means.multi li::before{counter-increment:m;content:counter(m);position:absolute;left:0;top:4px;font-size:12px;font-weight:800;color:var(--ink-3);width:16px;height:16px}
.rel{margin-top:16px;padding:10px 12px;background:var(--bg);border-radius:12px;font-size:13.5px;color:var(--ink-2);display:grid;gap:4px}
.rel em{font-style:normal;font-weight:700;color:var(--ink-3);margin-right:8px;font-size:12px}
.rel .pos{margin:0 0 0 2px}
.rel .sep{color:var(--ink-3);margin:0 6px}
.ex-toggle{margin-top:14px;font-size:13.5px;font-weight:700;color:var(--spot);padding:6px 0}
.exs{display:grid;gap:10px;margin-top:4px}
.e{font-size:14.5px;padding-left:10px;border-left:3px solid var(--spot-bg);line-height:1.55}
.e .ko{display:block;color:var(--ink-3);font-size:13px;margin-top:2px}
.flash .face.ex-face{justify-content:flex-start;align-items:stretch;text-align:left;padding:62px 22px 48px}
.ex-q{font-size:clamp(21px,6vw,25px);font-weight:800;letter-spacing:-.01em;line-height:1.35;padding-bottom:16px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.ex-q .ex-w{color:var(--spot)}
.ex-again{display:inline-block;font-size:11.5px;font-weight:700;color:var(--no);background:var(--no-bg);border-radius:6px;padding:1px 7px;margin-bottom:10px}
.ex-en{font-size:clamp(17px,5vw,19px);font-weight:500;line-height:1.65;color:var(--ink)}
.ex-face .hint{text-align:center}
.ex-mean{font-size:20px;font-weight:800;line-height:1.4}
.other{margin-top:14px;font-size:13px;color:var(--ink-3)}
.float-tools{position:absolute;top:10px;right:10px;display:flex;gap:2px;z-index:2}
.float-tools .icon-btn{width:38px;height:38px}
.star-on{color:var(--mid)!important}
.swipe-tag{position:absolute;top:18px;font-weight:800;font-size:15px;padding:4px 10px;border-radius:8px;opacity:0;pointer-events:none;z-index:3}
.swipe-tag.l{left:16px;color:var(--no);border:2px solid var(--no)}
.swipe-tag.r{right:16px;color:var(--ok);border:2px solid var(--ok)}
/* quiz */
.q-card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:26px 18px;text-align:center;position:relative;min-height:170px;display:flex;flex-direction:column;justify-content:center}
.q-card .word{font-size:clamp(28px,9vw,38px);font-weight:800;letter-spacing:-.02em}
.q-card .kmean{font-size:20px;font-weight:700;line-height:1.45}
.q-card .ctx{font-size:15px;color:var(--ink-2);margin-top:16px;padding-top:14px;border-top:1px solid var(--line);line-height:1.6;text-align:left}
.q-card .ctx b{color:var(--spot)}
.q-card.q-left{text-align:left;justify-content:flex-start;padding:22px 20px 20px}
.q-lab{font-size:12.5px;font-weight:700;color:var(--ink-3);margin-bottom:10px}
.q-mean{font-size:clamp(19px,5.6vw,23px);font-weight:800;line-height:1.45}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opt{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 14px;text-align:left;font-size:15.5px;font-weight:600;line-height:1.4;display:flex;gap:10px;align-items:flex-start}
.opt .n{color:var(--ink-3);font-weight:700;flex:none;width:18px}
.opt.right{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opt.wrong{border-color:var(--no);background:var(--no-bg);color:var(--no)}
.opt:disabled{cursor:default}
.feedback{margin-top:12px;border-radius:14px;padding:12px 14px;font-size:14.5px}
.feedback.ok{background:var(--ok-bg);color:var(--ok)}.feedback.no{background:var(--no-bg);color:var(--no)}
.feedback b{font-weight:800}
.next{margin-top:10px;width:100%;background:var(--ink);color:var(--bg);border-radius:16px;padding:15px 0;font-weight:700}
/* done */
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 8px}
.done-mark{width:150px;margin-bottom:6px}.done-mark .kft .d{width:16px;height:16px}
.done h2{margin:10px 0 4px;font-size:22px}
.done p{color:var(--ink-2);margin:0 0 18px}
.done .res{display:flex;gap:8px;width:100%;margin-bottom:16px}
.done .res div{flex:1;border-radius:14px;padding:12px 0;font-size:12px}
.done .res b{display:block;font-size:22px}
.done .btns{display:flex;flex-direction:column;gap:8px;width:100%}
.btn{border-radius:16px;padding:15px 0;font-weight:700;width:100%;background:var(--card);border:1px solid var(--line)}
.btn.pri{background:var(--spot);color:var(--spot-ink);border-color:transparent}
.wrong-list{width:100%;text-align:left;margin-bottom:16px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.wrong-h{width:100%;text-align:left;font-size:13px;font-weight:700;color:var(--ink-2);margin:0 2px 8px}.wrong-h span{font-weight:500;color:var(--ink-3)}
.wchips{width:100%;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.wchip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14px;text-align:left;max-width:100%}
.wchip b{font-weight:700}.wchip span{display:none;font-size:13px;color:var(--ink-2);margin-left:6px}
.wchip.open{border-color:var(--spot);background:var(--spot-bg);border-radius:12px}.wchip.open span{display:inline}
.btn-row{display:flex;gap:8px}.btn-row .btn{flex:1}
.cnt-b{display:inline-block;min-width:22px;padding:0 6px;border-radius:999px;background:rgba(255,255,255,.22);font-size:13px;margin-left:4px}
.st-mini{width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:-4px 0 14px;display:grid;gap:6px}
.st-mini.got{border-color:var(--spot)}
.st-mini-h{font-size:13.5px;font-weight:700;color:var(--ink-2);text-align:left}.st-mini-h b{color:var(--spot)}
.plus{margin-left:8px;font-size:12px;font-weight:800;color:var(--spot-ink);background:var(--spot);border-radius:6px;padding:1px 7px}
.st-row{display:flex;align-items:center;justify-content:space-between;padding:4px 8px;border-radius:10px}
.st-row.me{background:var(--spot-bg)}
.st-row>span{font-size:14px;font-weight:700}
.st-note{font-size:12.5px;color:var(--ink-3);text-align:left}
.btn small{display:block;font-size:12px;font-weight:500;opacity:.75;margin-top:2px}
/* word list */
.wl{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.wl-row{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
.wl-row:first-child{border-top:0}
.wl-row .i{font-size:12px;color:var(--ink-3);width:24px;flex:none;padding-top:3px;font-variant-numeric:tabular-nums}
.wl-row .w{font-weight:700;font-size:15.5px}
.wl-row .w small{font-weight:400;color:var(--ink-3);font-size:12.5px;margin-left:6px}
.wl-row .m{font-size:14px;color:var(--ink-2);line-height:1.45}
.wl-row.two{align-items:center;gap:10px;padding:10px 8px 10px 14px}
.wl-row.two .w{width:38%;flex:none;font-size:15.5px;font-weight:700;word-break:break-word}
.wl-row.two .m{flex:1;min-width:0;font-size:14.5px;color:var(--ink);padding:2px 4px}
.wl-row.two .say{width:32px;height:32px;flex:none}.wl-row.two .say svg{width:18px;height:18px}
.wl-row.two .lv{margin:0 2px 0 0}
.wl-row .m.hide{background:var(--line);border-radius:6px;user-select:none}.wl-row .m.hide *{visibility:hidden}
.wl-row .m .ml{color:var(--ink-2)}
.wl-row .lv{flex:none;width:8px;height:8px;border-radius:50%;margin-top:8px}
.lv0{background:var(--line)}.lv1{background:var(--no)}.lv2,.lv3{background:var(--mid)}.lv4,.lv5,.lv6{background:var(--ok)}
.search{width:100%;font:inherit;font-size:15px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);outline:none;margin-bottom:10px}
.search:focus{border-color:var(--spot)}
/* settings sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:86dvh;overflow:auto}
.sheet h3{margin:4px 0 12px;font-size:17px}
.opt-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.opt-row:last-child{border-bottom:0}
.opt-row .l{font-size:15px;font-weight:600}.opt-row .l small{display:block;font-size:12px;color:var(--ink-3);font-weight:400}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.sw.on{background:var(--spot)}.sw.on::after{transform:translateX(20px)}
.seg button{font-size:13.5px}
.rw-goal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.rw-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}.rw-h span{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.scard{display:grid;gap:6px;margin-top:14px}
.sweek{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--bg)}
.sweek.clear{background:var(--spot-bg)}
.sweek.cur{box-shadow:inset 0 0 0 1.5px var(--spot)}
.swl{flex:1;min-width:0;display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:baseline}
.swl b{font-size:13.5px;font-weight:800;white-space:nowrap}
.sweek.clear .swl b{color:var(--spot)}
.swl span{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swl small{grid-column:1/-1;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.sdots{display:flex;gap:5px;flex:none}
.sd{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px dashed var(--line);flex:none}
.sd.on{background:var(--spot);border:0;color:var(--spot-ink);font-weight:800;font-size:10px;letter-spacing:-.02em;transform:rotate(-12deg)}
.imp{font-size:10.5px;font-weight:700;color:var(--no);background:var(--no-bg);border-radius:5px;padding:1px 5px;vertical-align:1px}
.got-tag.imp{color:var(--no);background:var(--no-bg)}
.st-line{font-size:14px;font-weight:700;border-radius:12px;padding:9px 14px;margin:-6px 0 14px;background:var(--spot-bg);color:var(--spot)}
.st-line.max,.st-line.small{background:var(--line);color:var(--ink-2);font-weight:600}
.rw-sub{font-size:12.5px;color:var(--ink-3);margin-top:10px;text-align:center}
.set.rw:not(.got){opacity:.85}.set.rw:not(.got) .no{background:var(--line);filter:grayscale(1)}
.got-tag{margin-left:6px;font-size:11px;font-weight:800;color:var(--spot-ink);background:var(--spot);border-radius:6px;padding:1px 6px;vertical-align:1px}
.cert{border:2px solid var(--spot);border-radius:20px;padding:22px 18px;text-align:center;background:var(--card);position:relative}
.cert::before{content:"";position:absolute;inset:6px;border:1px dashed var(--spot-2);border-radius:15px;pointer-events:none;opacity:.6}
.cert-k{font-size:12px;font-weight:800;letter-spacing:.22em;color:var(--spot)}
.cert-ic{margin:14px 0 8px;display:flex;justify-content:center}
.rics{display:inline-flex;gap:5px;align-items:center}
.rics .kfd{width:9px;height:9px}.rics .kfd.off{background:none;border:1.5px solid var(--ink-3)}
.cert-ic .rics{gap:10px}.cert-ic .kfd{width:16px;height:16px}
.cert-t{font-size:22px;font-weight:800}
.cert-n{font-size:28px;font-weight:800;margin-top:12px;letter-spacing:-.01em}
.cert-d{font-size:13px;color:var(--ink-3);margin-top:4px}
.cert-code{margin:16px auto 0;background:var(--spot-bg);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.cert-code span{font-size:11.5px;color:var(--ink-3);font-weight:700}
.cert-code b{font-size:26px;letter-spacing:.12em;font-family:ui-monospace,Menlo,monospace;color:var(--spot)}
.cert-f{font-size:11.5px;color:var(--ink-3);margin-top:14px;letter-spacing:.04em}
.oj-note{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;font-size:14.5px;line-height:1.6}
.oj-note-h{font-weight:800;color:var(--spot);margin-bottom:6px;font-size:13px;letter-spacing:.04em}
.nm{font:inherit;font-size:15px;width:120px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.tc{display:grid;gap:10px}.tc label{display:grid;gap:4px;font-size:13px;font-weight:700;color:var(--ink-2)}
.tc input,.tc select{font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.guide{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:2px 14px 12px;margin-top:12px}
.guide-h{width:100%;display:flex;align-items:center;gap:9px;padding:11px 0 8px}
.guide-h b{font-size:15px;font-weight:800;flex:1;text-align:left}.guide-h .gt{font-size:12.5px;color:var(--ink-3);font-weight:600}
.guide-l{list-style:none;margin:2px 0 12px;padding:0 0 12px;display:grid;gap:9px;counter-reset:g;border-bottom:1px solid var(--line)}
.guide-l li{display:grid;grid-template-columns:22px 1fr;column-gap:8px;counter-increment:g}
.guide-l li::before{content:counter(g);grid-row:span 2;font-size:12px;font-weight:800;color:var(--spot);font-style:italic;padding-top:2px}
.guide-l b{font-size:14.5px;font-weight:700}
.guide-l span{font-size:12.5px;color:var(--ink-3);line-height:1.45}
.goal{background:var(--spot-bg);border-radius:12px;padding:10px 12px;display:grid;gap:7px}
.goal-h{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--ink-2)}
.goal-h b{color:var(--spot);font-size:14px}.goal-h span{margin-left:auto;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.goal-r{display:flex;align-items:center;gap:10px}
.goal-r .gl{min-width:46px;font-size:13.5px;font-weight:700;flex:none;white-space:nowrap}
.goal-r .gn{width:28px;text-align:right;font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}
.goal .kft .d{background:var(--spot-bg)}.goal .kft .d.on{background:var(--spot)}
.cert-sample{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;color:var(--no);background:var(--no-bg);border-radius:6px;padding:2px 8px}
.tcd{font-family:ui-monospace,Menlo,monospace;font-size:14px;font-weight:700;color:var(--spot);letter-spacing:.06em;flex:none}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.muted{color:var(--ink-3);font-size:12.5px;text-align:center;margin:22px 0 4px;line-height:1.6}
@media (min-width:600px){.app{padding-top:24px}}
.app.fixed{height:100dvh;min-height:0;overflow:hidden}
.app.fixed .flash{min-height:0}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<div id="gate" class="gate"><div class="gate-in">
  <div class="gate-top"><span class="brand">KEYFRAME 어휘</span><span class="brand-oj">조오제 영어</span></div>
  <div class="gate-mark"><span class="kfd"></span><span class="gate-line"></span></div>
  <h1 class="gate-t">로그인 코드를 입력하세요</h1>
  <p class="gate-s">선생님께 받은 내 코드로 단어장이 열려요.</p>
  <form id="gform" autocomplete="off"><input id="gcode" type="password" placeholder="로그인 코드" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"><button id="gbtn">열기</button></form>
  <p class="gate-err" id="gerr"></p>
</div></div>
<style>
.gate{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;justify-content:center;padding:calc(env(safe-area-inset-top) + 18px) 16px 16px}
.gate-in{width:100%;max-width:420px}
.gate-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:64px}
.gate-top .brand{font-size:15px;font-weight:800;letter-spacing:.16em;color:var(--spot)}
.gate-top .brand-oj{font-size:16px;font-weight:800;color:var(--ink)}
.gate-mark{display:flex;align-items:center;gap:0;margin-bottom:18px}
.gate-mark .kfd{width:12px;height:12px}
.gate-line{flex:1;height:1px;background:var(--line);margin-left:6px}
.gate-t{font-size:24px;font-weight:800;margin:0 0 6px;letter-spacing:-.01em}
.gate-s{color:var(--ink-3);font-size:14px;margin:0 0 22px}
#gform{display:flex;gap:8px}
#gcode{flex:1;min-width:0;font:inherit;font-size:18px;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);outline:none}
#gcode:focus{border-color:var(--spot)}
#gbtn{background:var(--spot);color:var(--spot-ink);border-radius:14px;padding:0 20px;font-weight:800;font-size:16px}
#gbtn:disabled{opacity:.6}
.gate-err{color:var(--no);font-size:14px;font-weight:600;min-height:20px;margin-top:10px}
.gate.ok{display:none}
</style>

const norm=c=>c.toUpperCase().replace(/[^A-Z0-9]/g,"");
async function unlock(code){
  code=norm(code); const te=new TextEncoder();
  const km=await crypto.subtle.importKey("raw",te.encode(code),"PBKDF2",false,["deriveBits"]);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:b(ENC.s),iterations:ENC.n,hash:"SHA-256"},km,384));
  const tag=[...bits.slice(32,48)].map(x=>x.toString(16).padStart(2,"0")).join(""), e=ENC.keys[tag];
  if(!e)throw new Error("no");
  const dec=async(raw,o)=>new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:b(o.i)},await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]),b(o.c)));
  const info=JSON.parse(new TextDecoder().decode(await dec(bits.slice(0,32),e)));
  const js=new TextDecoder().decode(await dec(b(info.k),ENC.body));
  const s=document.createElement("script");s.textContent="window.KF_USER="+JSON.stringify(info.u)+";\n"+js+"\n"+document.getElementById("app-src").textContent;document.body.appendChild(s);
  document.getElementById("gate").classList.add("ok");
}
const f=document.getElementById("gform"),inp=document.getElementById("gcode"),btn=document.getElementById("gbtn"),err=document.getElementById("gerr");
f.onsubmit=async e=>{e.preventDefault();const v=inp.value.trim();if(!v)return;btn.disabled=true;btn.textContent="확인 중";err.textContent="";

if(!window.crypto||!crypto.subtle){err.textContent="이 브라우저에서는 열 수 없어요. Safari나 Chrome 최신 버전으로 열어 주세요.";btn.disabled=true;}
else if(saved)unlock(saved).catch(()=>{try{localStorage.removeItem(KEY);}catch(x){}});
else setTimeout(()=>inp.focus(),100);
})();

<script type="text/plain" id="app-src">
(function(){
"use strict";
const D=window.KF_DATA, CARD={}; D.cards.forEach(c=>CARD[c.id]=c);
const SET={}; D.sets.forEach(s=>SET[s.id]=s);
const DAY=86400000, INTERVAL=[0,1,2,4,7,15,30]; // 상자별 복습 간격(일)
const MASTER=4;                                     // 4상자 이상 = 암기 완료
const U=window.KF_USER||null;            // 웹 게시본: 로그인한 사람(학생·공통·샘플·선생님)
const KEY="kf-vocab-v1"+(U?":"+U.id:"");    // 로그인 코드마다 학습 기록을 따로 저장
/* ---------- 저장 ---------- */
let S={cards:{},stars:{},opt:{size:20,front:"en",tts:false,shuffle:true,theme:"auto",rel:true,fastok:false,name:""},log:{},last:null,studyDays:{},rewards:{},importLock:null};
try{const raw=localStorage.getItem(KEY); if(raw){const o=JSON.parse(raw); S={...S,...o,opt:{...S.opt,...(o.opt||{})}};}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function st(id){return S.cards[id]||{b:0,due:0,seen:0,wrong:0};}
function today(){const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function startOfToday(){const d=new Date();d.setHours(0,0,0,0);return +d;}
function bump(n){const t=today();S.log[t]=(S.log[t]||0)+n;}
/* 스탬프: 단어 10개 이상 학습(카드·예문·퀴즈)을 끝까지 마치면 1개, 하루 최대 3개. 3개 = 1일차 클리어, 10일차 = 카드 완성 */
/* 주차 스탬프: 진도표(schedule.json)의 주차 범위를 서로 다른 날 TIMES회 학습하면 칸 완성.
   1회 = 그 범위에서 단어 10개 이상 학습을 끝까지 마친 날(하루에 범위당 1회만) */
const SCHED=window.KF_SCHED||{times:3,weeks:[]}, TIMES=SCHED.times, MIN_ITEMS=10;
function setDays(id){return (S.studyDays&&S.studyDays[id])||[];}
function shortSet(id){if(id==="review")return"전체 복습";const x=SET[id];return x.part===1?x.t:x.t.replace("Chapter ","Ch");}
function weekInfo(w){
  if(w.rule==="any"){const u=new Set();w.sets.forEach(id=>setDays(id).forEach(d=>u.add(d)));return{n:Math.min(TIMES,u.size),parts:[]};}
  const parts=w.sets.map(id=>({id,n:Math.min(TIMES,setDays(id).length)}));return{n:Math.min(...parts.map(x=>x.n)),parts};}
function weekLabelSets(w){return w.note||(w.sets.length===1&&w.sets[0]==="review"?"오늘의 복습 · 전체 단어":w.sets.map(shortSet).join(" · "));}
function lockedWeeks(){return (S.importLock&&S.importLock.weeks)||[];}
function clearedWeeks(){return SCHED.weeks.filter((w,i)=>weekInfo(w).n>=TIMES&&!lockedWeeks().includes(i)).length;}
function curWeek(){const i=SCHED.weeks.findIndex(w=>weekInfo(w).n<TIMES);return i<0?SCHED.weeks.length-1:i;}
function markStudy(setId,n,kind){
  if(kind==="retry")return{r:""}; if(setId==="_due"||setId==="_all")setId="review"; else if(!SET[setId])return{r:"virt"}; if(n<MIN_ITEMS)return{r:"small"};
  S.studyDays=S.studyDays||{};const a=S.studyDays[setId]=S.studyDays[setId]||[];
  const wi=SCHED.weeks.findIndex(w=>w.rule!=="any"&&w.sets.includes(setId));
  if(a.includes(today()))return{r:"same",wi,key:setId};
  const before=wi>=0?weekInfo(SCHED.weeks[wi]).n:0; a.push(today()); save();
  const after=wi>=0?weekInfo(SCHED.weeks[wi]).n:0; if(after>before)JUST.stamp=true;
  return{r:"ok",wi,gained:after>before,key:setId};
}
let JUST={stamp:false,rewards:[]};
/* 결과 기록: grade 0=모름 1=헷갈림 2=외움 */
function record(id,grade){
  const c={...st(id)}; c.seen++;
  if(grade===2){ c.b=Math.min(c.b+1,INTERVAL.length-1); }
  else if(grade===1){ c.b=Math.max(1,c.b-1); }
  else { c.b=1; c.wrong++; }
  c.due=startOfToday()+INTERVAL[c.b]*DAY;
  if(c.b===1&&grade<2) c.due=startOfToday()+DAY; // 틀린 단어는 내일 다시
  c.t=Date.now(); S.cards[id]=c; bump(1); save();
}
function isDue(id){const c=S.cards[id];return c&&c.b>0&&c.due<=Date.now();}
function level(id){return st(id).b;}
function statsOf(ids){let m=0,l=0,n=0,due=0;ids.forEach(id=>{const b=level(id);if(b>=MASTER)m++;else if(b>0)l++;else n++;if(isDue(id))due++;});return{m,l,n,due,total:ids.length};}
function streak(){let k=0;const d=new Date();for(;;){const key=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();if(S.log[key]){k++;d.setDate(d.getDate()-1);}else{if(k===0&&key===today()){d.setDate(d.getDate()-1);const k2=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();if(!S.log[k2])break;continue;}break;}}return k;}

/* ---------- OJ's 스페셜 보상 ---------- */
const OJ=window.KF_OJ||{};
const PASS=2;
function passed(ids){return ids.every(id=>level(id)>=PASS);}
function stampCount(){return SCHED.weeks.reduce((t,w)=>t+weekInfo(w).n,0);}
function mastered(){return allIds().filter(id=>level(id)>=MASTER).length;}
const P1=()=>D.sets.filter(x=>x.part===1), P2=()=>D.sets.filter(x=>x.part===2);
/* 클리어한 주차 범위의 단어 수 (1~9주차 = 주당 111단어, 9주차 = 112단어) */
function rIc(r,on){let h="";for(let k=0;k<r.ic;k++)h+=`<span class="kfd ${on?"":"off"}"></span>`;return `<span class="rics">${h}</span>`;}
function clearedWords(){return SCHED.weeks.reduce((t,w,i)=>t+(weekInfo(w).n>=TIMES&&!lockedWeeks().includes(i)?w.sets.reduce((u,id)=>u+(SET[id]?SET[id].c.length:0),0):0),0);}

    ${q}</div>
  <div class="opts">${QZ.opts.map((o,k)=>{let cls="";if(ans){if(o===id)cls="right";else if(o===ans.v)cls="wrong";}
      return `<button class="opt ${cls}" data-o="${o}" ${ans?"disabled":""}><span class="n">${k+1}</span><span style="flex:1;min-width:0">${t==="mean"?esc(plainMean(CARD[o])):esc(CARD[o].w)}</span></button>`;}).join("")}</div>
  ${ans?`<div class="feedback ${ans.ok?"ok":"no"}">${ans.ok?"<b>정답!</b> ":`<b>정답은 ${esc(c.w)}</b> · `}${esc(plainMean(c))}</div>
    <button class="next" id="nx">${QZ.i+1<QZ.items.length?"다음":"결과 보기"}</button>`:""}`;
  $("#bk").onclick=()=>{if(confirm("퀴즈를 그만둘까요? 푼 문제 기록은 저장돼요."))go({name:"set",id:QZ.set.id});};
  $("#say").onclick=()=>speak(c.w);
  if(t==="mean"&&!ans&&S.opt.tts)speak(c.w);
  if(ans){$("#nx").onclick=()=>{QZ.i++;QZ.answered=null;render();};$("#nx").focus();if(t!=="mean")speak(c.w);return;}
  a.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>answer(id,b.dataset.o,b.dataset.o===id));
}
function answer(id,v,ok){QZ.answered={v,ok};record(id,ok?2:0);QZ.res[ok?"ok":"no"]++;if(!ok)QZ.wrongs.push(id);
  if(navigator.vibrate&&!ok)try{navigator.vibrate(60);}catch(e){}render();}
/* ---------- 결과 ---------- */
function Done(a){
  const quiz=view.quiz, R=quiz?QZ.res:SS.res, wr=quiz?QZ.wrongs:SS.wrongs, s=quiz?QZ.set:SS.set;
  const total=quiz?QZ.items.length:SS.total;
  const perfect=!wr.length;
  const SRC=quiz?QZ:SS; if(SRC.stampRes===undefined){SRC.stampRes=markStudy(s.id,total,quiz?"quiz":SS.kind);checkRewards();}
  const SR=SRC.stampRes, key=SR.key||(s.id==="_due"||s.id==="_all"?"review":s.id);
  const wi=SCHED.weeks.findIndex(w=>w.rule!=="any"&&w.sets.includes(key)), W=wi>=0?SCHED.weeks[wi]:null, WI=W?weekInfo(W):null;
  const stBox=W?`<div class="st-mini ${SR.gained?"got":""}"><div class="st-mini-h">${esc(W.label)} 스탬프 <b>${WI.n}/${TIMES}</b>${SR.gained?'<span class="plus">+1</span>':""}</div>
    ${WI.parts.map(x=>{const n=x.n;let d="";for(let k=0;k<TIMES;k++)d+=`<span class="sd ${k<n?"on":""} ${x.id===key&&SR.r==="ok"&&k===n-1?"new":""}">${k<n?"OJ":""}</span>`;
      return `<div class="st-row ${x.id===key?"me":""}"><span>${esc(shortSet(x.id))}</span><div class="sdots">${d}</div></div>`;}).join("")}
    ${SR.r==="same"?`<div class="st-note">${esc(shortSet(key))}는 오늘 이미 1회 찍었어요</div>`:SR.r==="small"?`<div class="st-note">${MIN_ITEMS}단어 이상 마쳐야 1회</div>`:""}</div>`:"";
  a.innerHTML=`<div class="top"><button class="icon-btn" id="bk" aria-label="닫기">${IC.x}</button><h1>${esc(s.t)}</h1></div>
  <div class="done"><div class="done-mark">${kft(Math.round((quiz?R.ok/total:R.ok/total)*3),3)}</div>
    <h2>${quiz?`${total}문제 중 ${R.ok}개 정답`:`${total}단어 학습 끝!`}</h2>
    <p>${perfect?"모두 한 번에 맞혔어요.":`처음에 몰랐던 단어 ${wr.length}개는 내일 복습에 나와요.`}</p>
    ${stBox}
    <div class="res">${quiz?`
      <div style="background:var(--ok-bg);color:var(--ok)"><b>${R.ok}</b>정답</div><div style="background:var(--no-bg);color:var(--no)"><b>${R.no}</b>오답</div>`:`
      <div style="background:var(--ok-bg);color:var(--ok)"><b>${R.ok}</b>한 번에 알았어요</div><div style="background:var(--no-bg);color:var(--no)"><b>${R.no}</b>몰랐어요</div>`}</div>
    ${wr.length?`<div class="wrong-h">${quiz?"틀린":"몰랐던"} 단어 ${wr.length}개 <span>· 눌러서 뜻 보기</span></div><div class="wchips">${wr.map(id=>`<button class="wchip" data-wid="${id}"><b>${esc(CARD[id].w)}</b><span>${esc(plainMean(CARD[id]))}</span></button>`).join("")}</div>`:""}
    <div class="btns">
      ${wr.length?`<button class="btn pri" id="again">다시 외우기 <span class="cnt-b">${wr.length}</span></button>`:""}
      <div class="btn-row">${s.id!=="_due"?`<button class="btn ${wr.length?"":"pri"}" id="more">${esc(SET[s.id]?shortSet(s.id):s.t)} 계속 →</button>`:""}<button class="btn" id="home">홈으로</button></div></div></div>`;
  $("#bk").onclick=$("#home").onclick=()=>go({name:"home"});
  if(wr.length)$("#again").onclick=()=>startStudy({...s},shuffle(wr),"retry",quiz?"word":SS.mode);
  const m=$("#more");if(m)m.onclick=()=>go({name:"set",id:s.id});
  a.querySelectorAll("[data-wid]").forEach(b=>b.onclick=()=>b.classList.toggle("open"));
}
/* ---------- 단어 목록 ---------- */
let LS={hide:false,q:""};
function List(a){
  const s=virt(view.id);
  a.innerHTML=`<div class="top"><button class="icon-btn" id="bk" aria-label="뒤로">${IC.back}</button><h1>${esc(s.t)} 단어 목록</h1><button class="icon-btn" id="homebtn" aria-label="홈으로">${IC.home}</button>
    <button class="chip ${LS.hide?"on":""}" id="hd">뜻 가리기</button></div>
    <input class="search" id="q" placeholder="단어나 뜻으로 찾기" value="${esc(LS.q)}">
    <div class="wl" id="wl"></div>
    <p class="muted">● 회색 새 단어 · 빨강 틀림 · 노랑 학습 중 · 초록 암기 완료<br>가린 뜻은 눌러서 확인해요.</p>`;
  const draw=()=>{const q=LS.q.toLowerCase();
    $("#wl").innerHTML=s.c.filter(id=>!q||CARD[id].w.toLowerCase().includes(q)||meanOf(CARD[id]).includes(LS.q)).map((id,i)=>{const c=CARD[id];
      return `<div class="wl-row two"><div class="w">${esc(c.w)}</div><div class="m ${LS.hide?"hide":""}" data-r>${esc(plainMean(c))}</div>
      <button class="icon-btn say" data-say="${id}" aria-label="발음">${IC.vol}</button><div class="lv lv${level(id)}"></div></div>`;}).join("")||`<div class="wl-row"><div class="m">찾는 단어가 없어요</div></div>`;
    $("#wl").querySelectorAll("[data-r]").forEach(m=>m.onclick=()=>m.classList.toggle("hide"));
    $("#wl").querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(CARD[b.dataset.say].w));};
  draw();
  $("#bk").onclick=()=>go({name:"set",id:s.id});
  $("#hd").onclick=()=>{LS.hide=!LS.hide;render();};
  $("#q").oninput=e=>{LS.q=e.target.value;draw();};
}
/* ---------- 설정 ---------- */
function Settings(){
  const bg=document.createElement("div");bg.className="sheet-bg";
  const sw=(k,l,sub)=>`<div class="opt-row"><div class="l">${l}<small>${sub}</small></div><button class="sw ${S.opt[k]?"on":""}" data-k="${k}" role="switch" aria-checked="${!!S.opt[k]}"></button></div>`;
  bg.innerHTML=`<div class="sheet"><h3>설정</h3>
    <div class="opt-row"><div class="l">카드 앞면<small>무엇을 보고 떠올릴지</small></div>
      <div class="chips"><button class="chip ${S.opt.front==="en"?"on":""}" data-front="en">영어</button><button class="chip ${S.opt.front==="ko"?"on":""}" data-front="ko">한국어 뜻</button></div></div>
    ${sw("tts","자동 발음","카드가 나오면 단어를 읽어 줘요")}
    ${sw("shuffle","순서 섞기","끄면 책에 나온 순서대로")}
    ${sw("fastok","알아요 → 바로 넘기기","정답 확인 없이 다음 카드로")}
    ${!U||U.type==="common"?`<div class="opt-row"><div class="l">이름<small>OJ's 스페셜 인증서에 들어가요</small></div><input class="nm" id="nm" value="${esc(S.opt.name)}" placeholder="이름"></div>`:""}
    <div class="opt-row"><div class="l">화면 테마</div>
      <div class="chips">${[["auto","자동"],["light","밝게"],["dark","어둡게"]].map(([v,l])=>`<button class="chip ${S.opt.theme===v?"on":""}" data-th="${v}">${l}</button>`).join("")}</div></div>
    <div class="opt-row"><div class="l">학습 기록 백업<small>불러온 기록으로 달성한 목표는 인증서가 잠겨요</small></div>
      <div class="chips"><button class="chip" id="ex">내보내기</button><button class="chip" id="im">불러오기</button></div></div>
    <div class="opt-row"><div class="l" style="color:var(--no)">학습 기록 초기화<small>모든 진도·별표가 지워져요</small></div><button class="chip" id="rs">초기화</button></div>
    ${U?`<div class="opt-row"><div class="l">로그인<small>${esc(U.type==="student"||U.type==="sample"?U.name+" ("+U.label+")":U.label)}</small></div><button class="chip" id="lo">로그아웃</button></div>`:""}
    <input type="file" id="fi" accept=".json,application/json" style="display:none">
    <button class="btn pri" id="cl" style="margin-top:14px">닫기</button>
    <p class="muted">복습 간격: 외울 때마다 1 → 2 → 4 → 7 → 15 → 30일<br>틀리면 1단계로 돌아가 내일 다시 나와요.</p></div>`;
  document.body.appendChild(bg);
  const close=()=>{bg.remove();render();};
  bg.onclick=e=>{if(e.target===bg)close();};
  bg.querySelector("#cl").onclick=close;
  bg.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const k=b.dataset.k;S.opt[k]=!S.opt[k];save();b.classList.toggle("on",S.opt[k]);});
  const nmI=bg.querySelector("#nm");if(nmI)nmI.onchange=e=>{S.opt.name=e.target.value.trim();save();};
  const lo=bg.querySelector("#lo");if(lo)lo.onclick=()=>{if(confirm("로그아웃할까요? 다시 들어올 때 로그인 코드가 필요해요.")){try{localStorage.removeItem("kf-code");}catch(e){}location.reload();}};
  bg.querySelectorAll("[data-front]").forEach(b=>b.onclick=()=>{S.opt.front=b.dataset.front;save();bg.querySelectorAll("[data-front]").forEach(x=>x.classList.toggle("on",x===b));});
  bg.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{S.opt.theme=b.dataset.th;save();applyTheme();bg.querySelectorAll("[data-th]").forEach(x=>x.classList.toggle("on",x===b));});
  bg.querySelector("#ex").onclick=()=>{try{const blob=new Blob([JSON.stringify(S)],{type:"application/json"});const u=URL.createObjectURL(blob);const l=document.createElement("a");l.href=u;l.download="KEYFRAME_어휘_학습기록_"+today()+".json";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);}catch(e){toast("내보내기에 실패했어요");}};
  const fi=bg.querySelector("#fi");
  bg.querySelector("#im").onclick=()=>fi.click();
  fi.onchange=()=>{const f=fi.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.cards)throw 0;S={...S,...o,opt:{...S.opt,...(o.opt||{})}};checkRewards();JUST.rewards=[];
    S.importLock={at:today(),rewards:Object.keys(S.rewards||{}),weeks:SCHED.weeks.map((w,i)=>weekInfo(w).n>=TIMES?i:-1).filter(i=>i>=0)};
    save();applyTheme();toast("불러왔어요 · 불러온 기록으로 달성한 목표는 인증서가 잠겨요");close();}catch(e){toast("올바른 백업 파일이 아니에요");}};r.readAsText(f);};
  bg.querySelector("#rs").onclick=()=>{if(confirm("모든 학습 기록을 지울까요? 되돌릴 수 없어요.")){S.cards={};S.stars={};S.log={};S.last=null;S.studyDays={};S.rewards={};S.importLock=null;save();toast("초기화했어요");close();}};
}
/* 키보드(태블릿·PC): Space 뒤집기, 1·2·3 채점 / 퀴즈 1~4, Enter 다음 */
document.addEventListener("keydown",e=>{
  if(document.querySelector(".sheet-bg"))return;
  if(view.name==="study"){const k=e.key;const c=s=>{const b=$(s);if(b){e.preventDefault();b.click();}};
    if(k==="ArrowLeft"||k==="1")c("#jno,#pno,#oops");else if(k==="ArrowRight"||k==="2")c("#jok,#pok,#nx");else if(k===" "||k==="Enter"){if(SS.phase==="front")c("#fl");else c("#nx,#pok");}}
  else if(view.name==="quiz"){if(!QZ.answered&&"1234".includes(e.key)){const b=document.querySelectorAll("[data-o]")[+e.key-1];if(b)b.click();}else if(QZ.answered&&e.key==="Enter"){const n=$("#nx");if(n)n.click();}}
});
render();
})();
</script>
</body>
</html>
